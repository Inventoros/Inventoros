name: Feature request
description: Suggest an idea or improvement for Inventoros.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thanks for the suggestion. Please search [existing issues](https://github.com/Inventoros/Inventoros/issues) first; adding a 👍 to an existing request helps us prioritise.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the workflow or situation, not only the solution.
      placeholder: When receiving stock across several warehouses, I have to ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
      description: Workarounds you use today, or how other tools handle this.
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Products and variants
        - Stock, locations and warehouses
        - Orders and fulfilment
        - Purchasing and receiving
        - Returns
        - Reports and exports
        - Customer portal
        - API (REST, GraphQL or MCP)
        - Plugins
        - Installation and updates
        - Other
  - type: checkboxes
    id: plugin
    attributes:
      label: Plugin
      options:
        - label: I would be willing to build this as a plugin, or help test it.
