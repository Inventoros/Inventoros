name: Bug report
description: Something in Inventoros does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search [existing issues](https://github.com/Inventoros/Inventoros/issues) first.

        **Security vulnerabilities must not be reported here.** Use [private vulnerability reporting](https://github.com/Inventoros/Inventoros/security/advisories/new) instead (see [SECURITY.md](https://github.com/Inventoros/Inventoros/blob/main/SECURITY.md)).
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Inventoros version
      description: Shown on the administrator Updates page, or in the `VERSION` file at the root of the installation.
      placeholder: "2.5.0"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How is Inventoros installed?
      options:
        - Docker (one-line installer)
        - Docker Compose (manual)
        - cPanel / shared hosting zip
        - From source (git clone)
        - Other
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where does it happen?
      multiple: true
      options:
        - Web app
        - Customer portal
        - REST API
        - GraphQL API
        - MCP server
        - Installer or updater
        - Plugin
        - Emails or PDF documents
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: PHP version, database and version, browser and version, operating system.
      placeholder: |
        PHP: 8.4
        Database: MySQL 8.0
        Browser: Firefox 140
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: From `storage/logs/laravel.log` or the browser console. Remove passwords, tokens, API keys and personal data first.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This is not a security vulnerability.
          required: true
