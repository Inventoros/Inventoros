name: e2e

on:
  pull_request:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: sqlite3, gd, bcmath

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Setup environment
        run: |
          cp .env.example .env
          sed -i 's|APP_URL=http://localhost|APP_URL=http://127.0.0.1:8000|' .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Build frontend assets
        run: npm run build

      - name: Seed database
        run: |
          php artisan migrate --force
          php artisan db:seed --class=ScreenshotSeeder --force

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 &
          sleep 3
          APP_URL=http://127.0.0.1:8000 npx playwright test \
            e2e/tests/dashboard.spec.ts \
            e2e/tests/dashboard-stockroom.spec.ts \
            e2e/tests/dashboard-review.spec.ts \
            e2e/tests/products.spec.ts \
            e2e/tests/product-form-actions.spec.ts \
            e2e/tests/orders.spec.ts \
            e2e/tests/plugins.spec.ts \
            e2e/tests/mobile-layout.spec.ts \
            e2e/tests/table-viewport.spec.ts \
            e2e/tests/feature-section-tabs.spec.ts \
            e2e/tests/ui-foundations.spec.ts \
            e2e/tests/account-navigation.spec.ts \
            e2e/tests/action-feedback.spec.ts \
            e2e/tests/notification-feedback.spec.ts \
            e2e/tests/locale-loading.spec.ts \
            e2e/tests/restricted-controls.spec.ts \
            e2e/tests/workspace-preferences.spec.ts \
            e2e/tests/global-search.spec.ts \
            e2e/tests/warehouse-stock.spec.ts \
            e2e/tests/storage-settings.spec.ts \
            e2e/tests/stock-reset.spec.ts \
            e2e/tests/stock-audit-history.spec.ts \
            e2e/tests/audit-review.spec.ts \
            e2e/tests/audit-pagination.spec.ts \
            e2e/tests/variant-replenishment.spec.ts \
            --project=setup --project=chromium
        env:
          CI: true

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
