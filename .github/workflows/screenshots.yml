name: screenshots

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    # Commits the screenshots back to main, so this job keeps a write token and
    # persisted checkout credentials. It runs only for version tags and manual
    # runs, never for pull requests.
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This workflow triggers on tag pushes, where checkout would land on
          # a detached HEAD. Check out the default branch so the screenshots
          # commit below has a branch to push to (a tag is cut from main's tip,
          # so its code matches).
          ref: main

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: sqlite3, gd, bcmath

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Setup environment
        run: |
          cp .env.example .env
          sed -i 's|APP_URL=http://localhost|APP_URL=http://127.0.0.1:8000|' .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Build frontend assets
        run: npm run build

      - name: Seed database
        run: |
          php artisan migrate --force
          php artisan db:seed --class=ScreenshotSeeder --force
          php artisan db:seed --class=ScreenshotBrandingSeeder --force
          # One scheduler pass records the heartbeat, so the dashboard doesn't
          # show the "background tasks need attention" banner in screenshots.
          php artisan schedule:run

      - name: Install Playwright
        run: npx playwright install chromium

      - name: Create required directories
        run: |
          mkdir -p screenshots
          mkdir -p e2e/.auth

      - name: Start server and take screenshots
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 &
          sleep 3
          APP_URL=http://127.0.0.1:8000 npx playwright test e2e/tests/screenshots.spec.ts --project=setup --project=chromium
        env:
          CI: true
          E2E_TEST_EMAIL: alex@northwind-supply.example

      - name: Upload as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screenshots
          path: screenshots/
          retention-days: 30

      - name: Commit screenshots to repo
        # Main often moves while this job runs (other merges land), so a plain
        # push is rejected as non-fast-forward. Commit only when the files
        # changed, then rebase onto the latest main and retry.
        env:
          COMMIT_MESSAGE: 'chore(screenshots): update from CI [skip ci]'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- 'screenshots/*.png'
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m "$COMMIT_MESSAGE"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto the latest main."
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 5))
          done
          echo 'Could not push after 5 attempts.' >&2
          exit 1
