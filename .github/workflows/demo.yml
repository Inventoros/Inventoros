name: demo-gifs

# Re-records the README demo GIFs in .github/demo/ (scripts/generate-demo.js)
# when the UI changes. Pull requests record them as a check and upload them as
# an artifact; pushes to main and manual runs commit the new GIFs.

on:
  push:
    branches: [main]
    paths:
      - 'resources/js/**'
      - 'resources/css/**'
      - 'scripts/generate-demo.js'
      - 'database/seeders/ReadmeDemoSeeder.php'
      - '.github/workflows/demo.yml'
  pull_request:
    branches: [main]
    paths:
      - 'resources/js/**'
      - 'resources/css/**'
      - 'scripts/generate-demo.js'
      - 'database/seeders/ReadmeDemoSeeder.php'
      - '.github/workflows/demo.yml'
  workflow_dispatch:

# Recording runs Composer, npm and Playwright, so it gets a read-only token
# and no persisted credentials. Only the commit job, which runs no project
# code and never runs for pull requests, can push.
permissions:
  contents: read

concurrency:
  group: demo-gifs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo-gifs:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: sqlite3, gd, bcmath

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Setup environment
        run: |
          cp .env.example .env
          sed -i 's|APP_URL=http://localhost|APP_URL=http://127.0.0.1:8000|' .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Build frontend assets
        run: npm run build

      - name: Seed the demo company
        run: php artisan migrate:fresh --force --seed --seeder=ReadmeDemoSeeder

      - name: Start server
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/serve.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/login -o /dev/null; then
              echo "[ready] app up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::The app did not start within 30s"
          cat /tmp/serve.log
          exit 1

      - name: Record demo GIFs
        run: node scripts/generate-demo.js
        env:
          DEMO_BASE_URL: http://127.0.0.1:8000
          DEMO_DEBUG_FRAMES: '1'

      - name: Verify GIFs
        run: |
          for GIF in .github/demo/receive-stock.gif .github/demo/order-to-ship.gif; do
            if [ ! -f "$GIF" ]; then
              echo "::error::Expected $GIF was not produced"
              exit 1
            fi
            SIZE=$(stat -c%s "$GIF")
            echo "[verify] $GIF size: $SIZE bytes"
            if [ "$SIZE" -lt 50000 ]; then
              echo "::error::$GIF is implausibly small ($SIZE bytes); the recording flow likely failed"
              exit 1
            fi
            if [ "$SIZE" -gt 5242880 ]; then
              echo "::error::$GIF exceeds 5 MB ($SIZE bytes); lower GIF_FPS or GIF_WIDTH in scripts/generate-demo.js"
              exit 1
            fi
          done

      - name: Upload GIFs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: demo-gifs
          path: .github/demo/*.gif
          retention-days: 14

      - name: Upload debug frames
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: demo-debug-frames
          path: |
            .github/demo/*_frame_*.png
            recordings/*-failure.png
          retention-days: 7
          if-no-files-found: ignore

  commit-gifs:
    needs: demo-gifs
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The latest main, not the triggering commit: main may have moved
          # while the GIFs were recorded.
          ref: main

      - name: Download recorded GIFs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: demo-gifs
          path: .github/demo

      - name: Commit updated GIFs
        # Main often moves while this job runs (other merges land), so a plain
        # push is rejected as non-fast-forward. Commit only when the files
        # changed, then rebase onto the latest main and retry.
        env:
          COMMIT_MESSAGE: 'chore(demo): update README demo GIFs [skip ci]'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '.github/demo/*.gif'
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m "$COMMIT_MESSAGE"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto the latest main."
            git fetch origin main
            git rebase origin/main
            sleep $((attempt * 5))
          done
          echo 'Could not push after 5 attempts.' >&2
          exit 1
