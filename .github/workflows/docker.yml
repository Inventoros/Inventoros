name: Docker image

# Builds the production image on every PR (no push) so a broken Dockerfile is
# caught before merge, and publishes it to GHCR on version tags.
#
#   v1.2.3 tag -> ghcr.io/inventoros/inventoros:1.2.3, :1.2, :1, :latest
#
# Docker Hub is an optional mirror: set the repository variable
# DOCKERHUB_IMAGE (for example inventoros/inventoros) and the secrets
# DOCKERHUB_USERNAME and DOCKERHUB_TOKEN, and tags push there too.

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/inventoros/inventoros

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: startsWith(github.ref, 'refs/tags/v') && vars.DOCKERHUB_IMAGE != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE }}
            ${{ vars.DOCKERHUB_IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=ref,event=pr
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}
          flavor: |
            latest=auto

      - name: Build (and push on tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          load: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -eux
          image="$(printf '%s\n' "$IMAGE_TAGS" | head -n1)"
          docker run -d --name inventoros-smoke -p 8080:8080 \
            -v inventoros-smoke-plugins:/app/plugins \
            -v inventoros-smoke-plugin-assets:/app/public/plugin-assets \
            -e APP_KEY="base64:$(openssl rand -base64 32)" \
            -e DB_CONNECTION=sqlite -e DB_DATABASE=:memory: \
            -e SESSION_DRIVER=file -e CACHE_STORE=file -e QUEUE_CONNECTION=sync \
            "$image"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/up >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8080/up
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/install)" = "200"
          docker exec inventoros-smoke whoami | grep -qx app

          docker exec inventoros-smoke sh -c 'test -s /app/plugins/hello-world/dist/plugin.js && test -s /app/plugins/hello-world/dist/plugin.css && test -s /app/plugins/tax-billing/dist/plugin.js && test -s /app/plugins/tax-billing/dist/plugin.css'

          # Browser fixtures contain known test credentials and never ship.
          docker exec inventoros-smoke sh -c 'test -z "$(find /app/database/seeders -type f \( -name "E2E*Seeder.php" -o -name "ScreenshotSeeder.php" \) -print)" && test -z "$(find /app -maxdepth 1 -type f -name "playwright*.config.*" -print)" && test -s /app/database/seeders/DatabaseSeeder.php && test -s /app/database/seeders/RoleSeeder.php'

          # The unprivileged web process can install plugins, and a fresh
          # worker/container sees the same files after the web container is gone.
          docker exec inventoros-smoke sh -c 'printf plugin > /app/plugins/persistence-check.txt; printf asset > /app/public/plugin-assets/persistence-check.txt'
          docker stop inventoros-smoke
          docker rm inventoros-smoke
          docker run --rm --entrypoint sh \
            -v inventoros-smoke-plugins:/app/plugins \
            -v inventoros-smoke-plugin-assets:/app/public/plugin-assets \
            "$image" -c 'test "$(cat /app/plugins/persistence-check.txt)" = plugin && test "$(cat /app/public/plugin-assets/persistence-check.txt)" = asset && test "$(whoami)" = app'

      - name: Installer end to end
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -eux
          version="$(tr -d '\r\n' < VERSION)"
          # The installer pins ghcr.io/inventoros/inventoros:$version; point
          # that tag at the image just built, and use this checkout's Compose
          # files rather than the release's.
          docker tag "$(printf '%s\n' "$IMAGE_TAGS" | head -n1)" "${IMAGE}:${version}"
          sudo INVENTOROS_SOURCE_DIR="$PWD" INVENTOROS_SKIP_PULL=true bash scripts/install.sh --version "$version" --dir /tmp/inventoros --port 8090 --yes
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8090/install)" = "200"
          sudo grep -q '^APP_KEY=base64:' /tmp/inventoros/.env
          test "$(sudo stat -c %a /tmp/inventoros/.env)" = "600"
          key="$(sudo grep '^APP_KEY=' /tmp/inventoros/.env)"
          # A re-run keeps the secrets and the running stack.
          sudo INVENTOROS_SOURCE_DIR="$PWD" INVENTOROS_SKIP_PULL=true bash scripts/install.sh --version "$version" --dir /tmp/inventoros --yes
          test "$(sudo grep '^APP_KEY=' /tmp/inventoros/.env)" = "$key"
          sudo grep -qx 'APP_PORT=8090' /tmp/inventoros/.env
          # Moving back to an older release is refused.
          if sudo INVENTOROS_SOURCE_DIR="$PWD" INVENTOROS_SKIP_PULL=true bash scripts/install.sh --version 1.0.0 --dir /tmp/inventoros --yes; then exit 1; fi

      - name: Installer logs
        if: failure()
        run: |
          sudo cat /tmp/inventoros/install.log || true
          (cd /tmp/inventoros && sudo docker compose logs --no-color --tail 100) || true

      - name: Container logs
        if: failure()
        run: docker logs inventoros-smoke || true
