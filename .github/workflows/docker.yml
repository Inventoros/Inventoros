name: Docker image

# Builds the production image on every PR (no push) so a broken Dockerfile is
# caught before merge, and publishes it to GHCR on version tags.
#
#   v1.2.3 tag -> ghcr.io/inventoros/inventoros:1.2.3, :1.2, :1, :latest

on:
  pull_request:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/inventoros/inventoros

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=ref,event=pr
          flavor: |
            latest=auto

      - name: Build (and push on tags)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          load: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -eux
          docker run -d --name inventoros-smoke -p 8080:8080 \
            -e APP_KEY="base64:$(openssl rand -base64 32)" \
            -e DB_CONNECTION=sqlite -e DB_DATABASE=/tmp/smoke.sqlite \
            -e SESSION_DRIVER=file -e CACHE_STORE=file -e QUEUE_CONNECTION=sync \
            "$(echo '${{ steps.meta.outputs.tags }}' | head -n1)"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/up >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8080/up
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/install)" = "200"
          docker exec inventoros-smoke whoami | grep -qx app

      - name: Container logs
        if: failure()
        run: docker logs inventoros-smoke || true
