name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  phpunit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3, dom, filter, gd, json, libxml, openssl, pcre, phar, tokenizer, zip, bcmath
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run PHPUnit tests
        run: php artisan test --ansi

  # Release ZIPs and the Docker image install with --no-dev. Prove the
  # runtime still has everything it needs (the MCP server in particular)
  # without the dev tools that used to pull laravel/mcp in.
  production-install:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3, dom, filter, gd, json, libxml, openssl, pcre, phar, tokenizer, zip, bcmath
          coverage: none

      - name: Install Composer dependencies (production)
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Verify the MCP server classes load
        run: |
          php -r 'require "vendor/autoload.php"; foreach (["Laravel\\Mcp\\Server", "Laravel\\Mcp\\Facades\\Mcp", "App\\Mcp\\Servers\\InventorosServer"] as $c) { if (! class_exists($c)) { fwrite(STDERR, "$c is missing from the --no-dev install\n"); exit(1); } } echo "MCP server classes present\n";'

      - name: Verify /mcp is routed
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan route:list --path=mcp | grep -q 'mcp'

  js-unit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # The locale parity test compiles every message with
      # @intlify/message-compiler, so dependencies must be installed.
      - name: Install dependencies
        run: npm ci

      - name: Run JS unit tests
        run: npm run test:js

  # The docs promise MySQL and PostgreSQL support, so run the whole suite
  # against real servers too. phpunit.<db>.xml force DB_CONNECTION and
  # DB_DATABASE (phpunit.xml's sqlite values would otherwise win over the job
  # env); host, port and credentials come from the env below.
  phpunit-database:
    name: phpunit (${{ matrix.database }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - database: mysql
            port: 3306
            username: root
          - database: pgsql
            port: 5432
            username: inventoros

    services:
      mysql:
        image: ${{ matrix.database == 'mysql' && 'mysql:8.0' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: inventoros_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psecret"
          --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: ${{ matrix.database == 'pgsql' && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: inventoros
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: inventoros_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U inventoros"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.port }}
      DB_USERNAME: ${{ matrix.username }}
      DB_PASSWORD: secret

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3, pdo_mysql, pdo_pgsql, dom, filter, gd, json, libxml, openssl, pcre, phar, tokenizer, zip, bcmath
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run PHPUnit tests
        # vendor/bin/phpunit directly: `artisan test --configuration` adds a
        # second --configuration, and the resulting runner warning exits 1.
        run: vendor/bin/phpunit --colors=always --configuration=phpunit.${{ matrix.database }}.xml
