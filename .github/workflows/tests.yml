name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  phpunit:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3, dom, filter, gd, json, libxml, openssl, pcre, phar, tokenizer, zip, bcmath
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup environment
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite

      - name: Run migrations
        run: php artisan migrate --force

      - name: Run PHPUnit tests
        run: php artisan test --ansi

  # Release ZIPs and the Docker image install with --no-dev. Prove the
  # runtime still has everything it needs (the MCP server in particular)
  # without the dev tools that used to pull laravel/mcp in.
  production-install:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3, dom, filter, gd, json, libxml, openssl, pcre, phar, tokenizer, zip, bcmath
          coverage: none

      - name: Install Composer dependencies (production)
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Verify the MCP server classes load
        run: |
          php -r 'require "vendor/autoload.php"; foreach (["Laravel\\Mcp\\Server", "Laravel\\Mcp\\Facades\\Mcp", "App\\Mcp\\Servers\\InventorosServer"] as $c) { if (! class_exists($c)) { fwrite(STDERR, "$c is missing from the --no-dev install\n"); exit(1); } } echo "MCP server classes present\n";'

      - name: Verify /mcp is routed
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan route:list --path=mcp | grep -q 'mcp'

  # `composer create-project inventoros/inventoros` installs from the GitHub
  # source archive of a tag, which leaves out everything marked export-ignore
  # in .gitattributes. Build that archive from this commit, install it the
  # same way Packagist would, and check the result boots to the web installer.
  composer-create-project:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3, dom, filter, gd, json, libxml, openssl, pcre, phar, tokenizer, zip, bcmath, sodium
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Build the source archive
        run: git archive --format=zip -o "$RUNNER_TEMP/inventoros.zip" HEAD

      - name: composer create-project
        working-directory: ${{ runner.temp }}
        run: |
          version="$(cat "$GITHUB_WORKSPACE/VERSION")"
          repository="$(printf '{"type":"package","package":{"name":"inventoros/inventoros","version":"%s","type":"project","dist":{"type":"zip","url":"%s"}}}' "$version" "$RUNNER_TEMP/inventoros.zip")"
          composer create-project inventoros/inventoros app "$version" --repository="$repository" --no-dev --no-interaction | tee create-project.log
          grep -q 'Open /install in your browser' create-project.log

      - name: Check the installed project
        working-directory: ${{ runner.temp }}/app
        run: |
          grep -q '^APP_KEY=base64:' .env
          test ! -e tests && test ! -e e2e && test ! -e phpunit.xml
          test ! -e database/database.sqlite
          php artisan route:list --path=install | grep -q 'install'

      - name: Build the frontend
        working-directory: ${{ runner.temp }}/app
        run: npm ci && npm run build

      - name: The site opens on the web installer
        working-directory: ${{ runner.temp }}/app
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > serve.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/up -o /dev/null && break
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{redirect_url}' http://127.0.0.1:8000/)" = 'http://127.0.0.1:8000/install'
          curl -sf http://127.0.0.1:8000/install | grep -q 'data-page='
          test -s storage/app/private/setup-token

  # Known-vulnerable runtime and build dependencies must not drift back in. The
  # job fails on advisories of any severity, including development tools used
  # to build the release. Runs weekly too: a new advisory can land without
  # any commit touching the lock files.
  dependency-audit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none

      - name: Composer audit (all locked dependencies)
        run: composer audit --locked --abandoned=report

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      # Fails on any advisory except the dated exceptions in scripts/npm-audit.mjs.
      - name: npm audit (all locked dependencies)
        run: node scripts/npm-audit.mjs

  js-unit:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      # The locale parity test compiles every message with
      # @intlify/message-compiler, so dependencies must be installed.
      - name: Install dependencies
        run: npm ci

      - name: Run JS unit tests
        run: npm run test:js

      - name: Verify bundled plugin interfaces rebuild cleanly
        run: |
          npm run build:plugin:hello-world
          npm run build:plugin:tax-billing
          git diff --exit-code -- plugins/hello-world/dist plugins/tax-billing/dist

  # The docs promise MySQL and PostgreSQL support, so run the whole suite
  # against real servers too. phpunit.<db>.xml force DB_CONNECTION and
  # DB_DATABASE (phpunit.xml's sqlite values would otherwise win over the job
  # env); host, port and credentials come from the env below.
  phpunit-database:
    name: phpunit (${{ matrix.database }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - database: mysql
            port: 3306
            username: root
          - database: pgsql
            port: 5432
            username: inventoros

    services:
      mysql:
        image: ${{ matrix.database == 'mysql' && 'mysql:8.0' || '' }}
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: inventoros_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psecret"
          --health-interval=5s --health-timeout=5s --health-retries=20
      postgres:
        image: ${{ matrix.database == 'pgsql' && 'postgres:16' || '' }}
        env:
          POSTGRES_USER: inventoros
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: inventoros_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U inventoros"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.port }}
      DB_USERNAME: ${{ matrix.username }}
      DB_PASSWORD: secret

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3, pdo_mysql, pdo_pgsql, dom, filter, gd, json, libxml, openssl, pcre, phar, tokenizer, zip, bcmath
          coverage: none

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run PHPUnit tests
        # vendor/bin/phpunit directly: `artisan test --configuration` adds a
        # second --configuration, and the resulting runner warning exits 1.
        run: vendor/bin/phpunit --colors=always --configuration=phpunit.${{ matrix.database }}.xml
