name: Build cPanel Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    # Build and check the package whenever the packaging changes, so a
    # broken package is caught before a tag is pushed.
    paths:
      - 'deploy/cpanel/**'
      - '.github/workflows/cpanel-release.yml'
      - 'app/Services/Update/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0)'
        required: false
        default: 'dev'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, pdo_mysql, dom, filter, gd, json, libxml, openssl, pcre, phar, tokenizer, zip, sodium
          coverage: none

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies (production)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      # /mcp is served by laravel/mcp; a dev-only dependency would silently
      # drop the MCP server from the release ZIP.
      - name: Verify the MCP server ships without dev dependencies
        run: |
          php -r 'require "vendor/autoload.php"; foreach (["Laravel\\Mcp\\Server", "Laravel\\Mcp\\Facades\\Mcp", "App\\Mcp\\Servers\\InventorosServer"] as $c) { if (! class_exists($c)) { fwrite(STDERR, "$c is missing from the --no-dev install\n"); exit(1); } } echo "MCP server classes present\n";'

      - name: Install NPM dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Rebuild the hello-world plugin UI bundle
        run: npm run build:plugin:hello-world

      - name: Determine version
        id: version
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
            echo "tag_name=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          elif [[ -n "$REQUESTED_VERSION" && "$REQUESTED_VERSION" != "dev" ]]; then
            echo "version=$REQUESTED_VERSION" >> $GITHUB_OUTPUT
            echo "tag_name=v$REQUESTED_VERSION" >> $GITHUB_OUTPUT
          else
            echo "version=dev-$(date +%Y%m%d%H%M%S)" >> $GITHUB_OUTPUT
            echo "tag_name=dev" >> $GITHUB_OUTPUT
          fi

      - name: Check release version and notes
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.version != 'dev')
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          test "$(tr -d '\r\n' < VERSION)" = "$RELEASE_VERSION"
          test -s "docs/releases/$RELEASE_VERSION.md"

      - name: Build the cPanel package
        # deploy/cpanel/build-release.php lays out inventoros/ + public_html/,
        # writes release.json (version, layout, min_php) for the in-app
        # updater, zips it and verifies the result.
        run: php deploy/cpanel/build-release.php --version="${{ steps.version.outputs.version }}" --out=.

      - name: Check the package contents
        # Fails on forbidden paths (.env files, tests, e2e, screenshots,
        # docker, dev dependencies, runtime state) or missing pieces.
        run: |
          unzip -l "inventoros-cpanel-${{ steps.version.outputs.version }}.zip" | tail -n 3
          unzip -p "inventoros-cpanel-${{ steps.version.outputs.version }}.zip" release.json
          php deploy/cpanel/build-release.php --verify="inventoros-cpanel-${{ steps.version.outputs.version }}.zip" --version="${{ steps.version.outputs.version }}"

      - name: Package the hello-world example plugin
        run: |
          # Single top-level hello-world/ folder, as the plugin uploader expects.
          (cd plugins && zip -r ../hello-world-plugin.zip hello-world -x 'hello-world/ui/node_modules/*')
          unzip -l hello-world-plugin.zip

      - name: Sign release zip
        env:
          INVENTOROS_UPDATE_SECRET_KEY: ${{ secrets.INVENTOROS_UPDATE_SECRET_KEY }}
          RELEASE_ZIP: inventoros-cpanel-${{ steps.version.outputs.version }}.zip
          RELEASE_TAG: ${{ steps.version.outputs.tag_name }}
        run: |
          if [ -n "$INVENTOROS_UPDATE_SECRET_KEY" ]; then
            # Detached Ed25519 signature over the exact zip bytes, base64-encoded
            # into <zip>.sig — the format App\Support\ReleaseSignatureVerifier
            # expects. Done with raw libsodium (no Laravel boot needed in CI).
            php -r '$s = base64_decode(trim(getenv("INVENTOROS_UPDATE_SECRET_KEY")), true); if ($s === false || strlen($s) !== SODIUM_CRYPTO_SIGN_SECRETKEYBYTES) { fwrite(STDERR, "Invalid INVENTOROS_UPDATE_SECRET_KEY\n"); exit(1); } preg_match("/^INVENTOROS_UPDATE_PUBLIC_KEY=(.+)$/m", file_get_contents(".env.example"), $m); $p = base64_decode(trim($m[1] ?? ""), true); if ($p !== sodium_crypto_sign_publickey_from_secretkey($s)) { fwrite(STDERR, "Signing key does not match the public key shipped to users\n"); exit(1); } $f = getenv("RELEASE_ZIP"); $sig = sodium_crypto_sign_detached(file_get_contents($f), $s); file_put_contents($f . ".sig", base64_encode($sig));'
            echo "Signed $RELEASE_ZIP -> $RELEASE_ZIP.sig"
            # Only the core package is signed with the update key. The example
            # plugin is NOT: anything signed with this key passes the core
            # updater's signature check. The marketplace signs the plugin with
            # its own key when it imports it (marketplace:import-release-asset).
          elif [ "$RELEASE_TAG" != "dev" ]; then
            echo "::error::INVENTOROS_UPDATE_SECRET_KEY is required to publish a signed release."
            exit 1
          else
            echo "::warning::INVENTOROS_UPDATE_SECRET_KEY is not set; release will be unsigned and in-app updates with signature verification enabled will reject it."
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: inventoros-cpanel-${{ steps.version.outputs.version }}
          path: |
            inventoros-cpanel-${{ steps.version.outputs.version }}.zip
            inventoros-cpanel-${{ steps.version.outputs.version }}.zip.sig
            hello-world-plugin.zip
          retention-days: 30
          if-no-files-found: ignore

      - name: Create GitHub Release
        if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.version != 'dev')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          files: |
            inventoros-cpanel-${{ steps.version.outputs.version }}.zip
            inventoros-cpanel-${{ steps.version.outputs.version }}.zip.sig
            hello-world-plugin.zip
          name: Release ${{ steps.version.outputs.tag_name }}
          body_path: docs/releases/${{ steps.version.outputs.version }}.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
