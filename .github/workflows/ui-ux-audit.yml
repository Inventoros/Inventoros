name: ui-ux-audit

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Rendered verification scope
        type: choice
        options: [full, desktop-and-states, interactions, locales]
        default: full

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_URL: http://127.0.0.1:8000
      UI_UX_AUDIT: '1'
      UI_UX_AUDIT_STRICT: '1'
      CI: true
      MAIL_MAILER: log
      REGISTRATION_ENABLED: true
      UI_UX_AUDIT_SCOPE: ${{ inputs.scope }}
      UI_UX_AUDIT_GREP: ${{ inputs.scope == 'locales' && 'authenticate|all supported languages' || inputs.scope == 'interactions' && 'authenticate|dialogs,|verification,|runtime plugin' || inputs.scope == 'desktop-and-states' && 'authenticate|1440px|dark theme|dialogs,|verification,|runtime plugin' || '.' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: sqlite3, gd, bcmath
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - run: npm ci
      - name: Prepare disposable application
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force
          npm run build
          npx playwright install --with-deps chromium
      - name: Audit rendered routes
        run: |
          PHP_CLI_SERVER_WORKERS=4 php artisan serve --no-reload --host=127.0.0.1 --port=8000 > /tmp/inventoros-server.log 2>&1 &
          if [ "$UI_UX_AUDIT_SCOPE" = full ]; then
            npx playwright test --config=playwright.audit.config.ts
          else
            npx playwright test e2e/tests/ui-ux-audit.spec.ts --project=setup --project=chromium --grep "$UI_UX_AUDIT_GREP"
          fi
      - name: Summarize rendered evidence
        if: always()
        run: node e2e/summarize-ui-audit.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ui-ux-audit
          path: |
            audit-artifacts/
            playwright-report/
            e2e/.auth/ui-audit.json
          retention-days: 30
