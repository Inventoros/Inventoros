name: ui-ux-audit

on:
  workflow_dispatch:
    inputs:
      scope:
        description: Rendered verification scope
        type: choice
        options: [full, desktop-and-states, interactions]
        default: full

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_URL: http://127.0.0.1:8000
      UI_UX_AUDIT: '1'
      UI_UX_AUDIT_STRICT: '1'
      CI: true
      MAIL_MAILER: log
      REGISTRATION_ENABLED: true
      UI_UX_AUDIT_GREP: ${{ inputs.scope == 'interactions' && 'authenticate|dialogs,|verification,|runtime plugin' || inputs.scope == 'desktop-and-states' && 'authenticate|1440px|dark theme|dialogs,|verification,|runtime plugin' || '.' }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: sqlite3, gd, bcmath
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - run: npm ci
      - name: Prepare disposable application
        run: |
          cp .env.example .env
          php artisan key:generate
          touch database/database.sqlite
          php artisan migrate --force
          npm run build
          npx playwright install --with-deps chromium
      - name: Audit rendered routes
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/inventoros-server.log 2>&1 &
          npx playwright test e2e/tests/ui-ux-audit.spec.ts --project=setup --project=chromium --grep "$UI_UX_AUDIT_GREP"
      - name: Summarize rendered evidence
        if: always()
        run: node e2e/summarize-ui-audit.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-ux-audit
          path: |
            audit-artifacts/
            playwright-report/
            e2e/.auth/ui-audit.json
          retention-days: 30
