# Inventoros production stack: web app + queue worker + scheduler + PostgreSQL.
#
#   1. Create a .env next to this file with at least:
#        APP_KEY=base64:...        (echo "base64:$(openssl rand -base64 32)")
#        APP_URL=https://inventory.example.com   (the address people type)
#        DB_PASSWORD=a-long-random-password
#      Optional: APP_PORT=8088 publishes the app on another host port
#      (default 8080). Change APP_PORT only; the container keeps listening
#      on 8080 inside, and SERVER_NAME stays as it is.
#   2. docker compose -f docker-compose.prod.yml up -d
#   3. Open APP_URL/install to create the first organization and admin.
#
# The image is pulled from GHCR (ghcr.io/inventoros/inventoros, published for
# every release; pin one with INVENTOROS_IMAGE=ghcr.io/inventoros/inventoros:2.0.0).
# To build from this checkout instead:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Behind a reverse proxy (nginx, Traefik, Caddy) that terminates TLS, point
# the proxy at APP_PORT and set APP_URL to the public https:// address.
# Proxies on private networks are trusted by default (TRUSTED_PROXIES).
#
# All three PHP services share one image, one environment, and persistent
# storage, plugin code and plugin assets. Only `app` runs migrations; worker and
# scheduler wait for it to be healthy so they never race on the schema.

x-inventoros: &inventoros
  image: ${INVENTOROS_IMAGE:-ghcr.io/inventoros/inventoros:latest}
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  environment: &inventoros-env
    APP_NAME: ${APP_NAME:-Inventoros}
    APP_ENV: production
    APP_DEBUG: "false"
    APP_KEY: ${APP_KEY:?Set APP_KEY in .env (echo "base64:$(openssl rand -base64 32)")}
    APP_URL: ${APP_URL:-http://localhost:${APP_PORT:-8080}}
    LOG_CHANNEL: stderr
    LOG_LEVEL: ${LOG_LEVEL:-warning}
    DB_CONNECTION: pgsql
    DB_HOST: db
    DB_PORT: "5432"
    DB_DATABASE: ${DB_DATABASE:-inventoros}
    DB_USERNAME: ${DB_USERNAME:-inventoros}
    DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    SESSION_DRIVER: database
    # "null" (the default) marks the session cookie Secure exactly when the
    # request arrived over https, directly or via a trusted proxy. A forced
    # "true" breaks every form (419) when the app is opened over plain http.
    SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-null}
    # Reverse proxies whose X-Forwarded-* headers are believed (comma-separated
    # IPs/CIDRs). The default trusts private networks, which covers a proxy in
    # another container or on the Docker host. See config/trustedproxy.php.
    TRUSTED_PROXIES: ${TRUSTED_PROXIES:-private_ranges}
    CACHE_STORE: database
    QUEUE_CONNECTION: database
    # The `worker` service processes the queue; the scheduler need not.
    QUEUE_RUN_VIA_SCHEDULER: "false"
    MAIL_MAILER: ${MAIL_MAILER:-log}
    MAIL_HOST: ${MAIL_HOST:-}
    MAIL_PORT: ${MAIL_PORT:-587}
    MAIL_USERNAME: ${MAIL_USERNAME:-}
    MAIL_PASSWORD: ${MAIL_PASSWORD:-}
    MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-inventory@example.com}
    MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Inventoros}
    SERVER_NAME: ${SERVER_NAME:-:8080}
    RUN_MIGRATIONS: "false"
  volumes:
    - storage:/app/storage
    - plugins:/app/plugins
    - plugin-assets:/app/public/plugin-assets
  depends_on:
    db:
      condition: service_healthy

services:
  app:
    <<: *inventoros
    environment:
      <<: *inventoros-env
      RUN_MIGRATIONS: "true"
    ports:
      - "${APP_PORT:-8080}:8080"

  worker:
    <<: *inventoros
    # Let a running import/export finish before Docker sends SIGKILL.
    stop_grace_period: 660s
    command: ["php", "artisan", "queue:work", "--tries=3", "--max-time=3600", "--sleep=3"]
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy

  scheduler:
    <<: *inventoros
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-inventoros}
      POSTGRES_USER: ${DB_USERNAME:-inventoros}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  storage:
  plugins:
  plugin-assets:
  db-data:
